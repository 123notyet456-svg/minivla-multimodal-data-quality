<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">不同输入与融合方案的测试 MAE</title>
  <desc id="desc">State+Language 简单融合 0.088374，主视角 0.096104，腕部视角 0.094052，双视角 0.093733；投影融合 State+Language 0.087578，双视角 0.087860。误差越低越好。</desc>
  <rect width="900" height="390" rx="16" fill="#f8fafc"/>
